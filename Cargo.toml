[package]
name = "vibectl"
version = "0.1.0"
edition = "2024"
description = "Vibe coding agent CLI in the terminal - an agentic coding assistant"
license = "MIT"

[[bin]]
name = "vibectl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "signal"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "rustls", "webpki-roots"] }
eventsource-stream = "0.2"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
ignore = "0.4"
regex = "1"
async-trait = "0.1"
dirs = "6"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1